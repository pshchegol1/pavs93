<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bucks2Bar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-4">Bucks2Bar</h1>
        <!-- Nav tabs -->
        <ul class="nav nav-tabs" id="bucks2barTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="data-tab" data-bs-toggle="tab" data-bs-target="#data" type="button" role="tab" aria-controls="data" aria-selected="true">Data</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="chart-tab" data-bs-toggle="tab" data-bs-target="#chart" type="button" role="tab" aria-controls="chart" aria-selected="false">Chart</button>
            </li>
        </ul>
        <div class="tab-content" id="bucks2barTabsContent">
            <!-- Data Tab -->
            <div class="tab-pane fade show active p-4" id="data" role="tabpanel" aria-labelledby="data-tab">
                <form id="dataForm">
                    <div class="table-responsive">
                        <table class="table table-bordered align-middle text-center">
                            <thead class="table-light">
                                <tr>
                                    <th>Month</th>
                                    <th>Income ($)</th>
                                    <th>Expense ($)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Jan</td>
                                    <td><input type="number" min="0" class="form-control income-input" name="income-jan" value="850"></td>
                                    <td><input type="number" min="0" class="form-control expense-input" name="expense-jan" value="320"></td>
                                </tr>
                                <tr>
                                    <td>Feb</td>
                                    <td><input type="number" min="0" class="form-control income-input" name="income-feb" value="720"></td>
                                    <td><input type="number" min="0" class="form-control expense-input" name="expense-feb" value="410"></td>
                                </tr>
                                <tr>
                                    <td>Mar</td>
                                    <td><input type="number" min="0" class="form-control income-input" name="income-mar" value="950"></td>
                                    <td><input type="number" min="0" class="form-control expense-input" name="expense-mar" value="600"></td>
                                </tr>
                                <tr>
                                    <td>Apr</td>
                                    <td><input type="number" min="0" class="form-control income-input" name="income-apr" value="540"></td>
                                    <td><input type="number" min="0" class="form-control expense-input" name="expense-apr" value="200"></td>
                                </tr>
                                <tr>
                                    <td>May</td>
                                    <td><input type="number" min="0" class="form-control income-input" name="income-may" value="1000"></td>
                                    <td><input type="number" min="0" class="form-control expense-input" name="expense-may" value="750"></td>
                                </tr>
                                <tr>
                                    <td>Jun</td>
                                    <td><input type="number" min="0" class="form-control income-input" name="income-jun" value="670"></td>
                                    <td><input type="number" min="0" class="form-control expense-input" name="expense-jun" value="480"></td>
                                </tr>
                                <tr>
                                    <td>Jul</td>
                                    <td><input type="number" min="0" class="form-control income-input" name="income-jul" value="890"></td>
                                    <td><input type="number" min="0" class="form-control expense-input" name="expense-jul" value="510"></td>
                                </tr>
                                <tr>
                                    <td>Aug</td>
                                    <td><input type="number" min="0" class="form-control income-input" name="income-aug" value="610"></td>
                                    <td><input type="number" min="0" class="form-control expense-input" name="expense-aug" value="300"></td>
                                </tr>
                                <tr>
                                    <td>Sep</td>
                                    <td><input type="number" min="0" class="form-control income-input" name="income-sep" value="780"></td>
                                    <td><input type="number" min="0" class="form-control expense-input" name="expense-sep" value="420"></td>
                                </tr>
                                <tr>
                                    <td>Oct</td>
                                    <td><input type="number" min="0" class="form-control income-input" name="income-oct" value="950"></td>
                                    <td><input type="number" min="0" class="form-control expense-input" name="expense-oct" value="690"></td>
                                </tr>
                                <tr>
                                    <td>Nov</td>
                                    <td><input type="number" min="0" class="form-control income-input" name="income-nov" value="530"></td>
                                    <td><input type="number" min="0" class="form-control expense-input" name="expense-nov" value="50"></td>
                                </tr>
                                <tr>
                                    <td>Dec</td>
                                    <td><input type="number" min="0" class="form-control income-input" name="income-dec" value="800"></td>
                                    <td><input type="number" min="0" class="form-control expense-input" name="expense-dec" value="370"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </form>
            </div>
            <!-- Chart Tab -->
            <div class="tab-pane fade p-4" id="chart" role="tabpanel" aria-labelledby="chart-tab">
                <div class="d-flex justify-content-end mb-2 gap-2">
                     <!-- download button -->
                    <button id="downloadChart" class="btn btn-primary"><i class="bi bi-download"></i> Download Chart</button>
                </div>
                <canvas id="incomeExpenseChart" height="100"></canvas>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
