<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OilWatch — Global Crude Markets</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⬡</span>
        <span class="logo-text">OilWatch</span>
        <span class="logo-sub">Global Crude Markets</span>
      </div>
      <div class="live-badge">
        <span class="pulse-dot"></span>
        <span>LIVE</span>
      </div>
      <div class="header-time" id="live-clock"></div>
    </div>
  </header>

  <!-- Tab Bar -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="prices">
      <span class="tab-icon">◈</span> World's Oil Prices
    </button>
    <button class="tab-btn" data-tab="charts">
      <span class="tab-icon">◉</span> Chart Information
    </button>
  </nav>

  <!-- Main Content -->
  <main class="main-content">

    <!-- ═══════════════ TAB 1: PRICES ═══════════════ -->
    <section id="tab-prices" class="tab-panel active">

      <div class="panel-header">
        <h2 class="panel-title">Global Crude Oil Benchmarks</h2>
        <p class="panel-subtitle">Select an oil grade to explore full market data</p>
        <div class="filter-bar">
          <button class="filter-pill active" data-filter="all">All Grades</button>
          <button class="filter-pill" data-filter="crude">Crude</button>
          <button class="filter-pill" data-filter="futures">Futures</button>
          <button class="filter-pill" data-filter="regional">Regional</button>
        </div>
      </div>

      <!-- Market Ticker -->
      <div class="ticker-wrap">
        <div class="ticker-track" id="ticker-track"></div>
      </div>

      <!-- Price Cards Grid -->
      <div class="cards-grid" id="cards-grid"></div>

    </section>

    <!-- ═══════════════ TAB 2: CHARTS ═══════════════ -->
    <section id="tab-charts" class="tab-panel">

      <div class="chart-layout">

        <!-- Selector Sidebar -->
        <aside class="chart-sidebar">
          <h3 class="sidebar-title">Select Grade</h3>
          <div class="oil-selector" id="oil-selector"></div>

          <div class="range-picker">
            <h4>Time Range</h4>
            <div class="range-btns">
              <button class="range-btn active" data-range="7">7D</button>
              <button class="range-btn" data-range="30">1M</button>
              <button class="range-btn" data-range="90">3M</button>
              <button class="range-btn" data-range="180">6M</button>
              <button class="range-btn" data-range="365">1Y</button>
            </div>
          </div>

          <div class="stats-panel" id="stats-panel"></div>
        </aside>

        <!-- Chart Area -->
        <div class="chart-area">
          <div class="chart-header">
            <div>
              <h2 class="chart-oil-name" id="chart-oil-name">Brent Crude</h2>
              <p class="chart-oil-desc" id="chart-oil-desc"></p>
            </div>
            <div class="chart-price-display">
              <span class="chart-current-price" id="chart-current-price">$0.00</span>
              <span class="chart-change-badge" id="chart-change-badge"></span>
            </div>
          </div>

          <div class="chart-container">
            <canvas id="price-chart"></canvas>
          </div>

          <div class="chart-container secondary-charts">
            <div class="sub-chart-box">
              <h4>Volume (kbd)</h4>
              <canvas id="volume-chart"></canvas>
            </div>
            <div class="sub-chart-box">
              <h4>Volatility Index</h4>
              <canvas id="volatility-chart"></canvas>
            </div>
          </div>

          <!-- Info Table -->
          <div class="info-table-wrap">
            <h3>Market Details</h3>
            <table class="info-table" id="info-table">
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
